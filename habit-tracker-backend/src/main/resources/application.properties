spring.application.name=habit-tracker-api
server.port=${PORT:8080}

# --- database -------------------------------------------------------------
# Default: an H2 file in ./data (fine on your PC, but it is wiped on Render's free tier).
# In production set DB_URL / DB_USER / DB_PASSWORD to a Postgres database, e.g.
#   DB_URL=jdbc:postgresql://HOST:5432/DBNAME
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/habits}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- app ------------------------------------------------------------------
# "Today" for streaks and check-ins is decided on the server, in this time zone.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Comma separated origins. * allows any origin (the Android app calls from https://localhost).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

server.error.whitelabel.enabled=false
